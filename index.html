<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ノートビューア</title>
<meta name="description" content="Googleドライブに置いたObsidianの保管庫を、iPhoneやPCで読むためのビューア（読み取り専用）">
<meta name="theme-color" content="#1f2328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--bg:#ffffff;--panel:#f6f8fa;--text:#1f2328;--muted:#656d76;--line:#d0d7de;--accent:#0969da;--accent-bg:#ddf4ff;--code:#f2f4f7;--warn:#9a6700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#8d96a0;--line:#30363d;--accent:#4493f8;--accent-bg:#122a4a;--code:#1c2129;--warn:#d29922}}
:root[data-theme="dark"]{--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#8d96a0;--line:#30363d;--accent:#4493f8;--accent-bg:#122a4a;--code:#1c2129;--warn:#d29922}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:300px 1fr;height:100dvh}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.top{padding:12px 12px 8px;display:flex;gap:8px;align-items:center;padding-top:max(12px,env(safe-area-inset-top))}
.top h1{font-size:15px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;cursor:pointer;min-height:36px}
.search{margin:0 12px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:calc(100% - 24px)}
.status{font-size:12px;color:var(--muted);padding:0 12px 8px}
.list{overflow:auto;flex:1;padding:0 6px 16px;-webkit-overflow-scrolling:touch}
.folder{font-size:12px;color:var(--muted);padding:10px 8px 2px;font-weight:600}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;min-height:40px}
.item:hover{background:var(--accent-bg)}
.item.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.item small{display:block;color:var(--muted);font-size:12px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{overflow:auto;min-width:0;-webkit-overflow-scrolling:touch}
.bar{display:none;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));z-index:1}
article{max-width:820px;margin:0 auto;padding:24px 20px 80px}
article h1{font-size:1.7em;line-height:1.3;margin:.2em 0 .6em}
article h2{font-size:1.3em;border-bottom:1px solid var(--line);padding-bottom:.2em;margin-top:1.6em}
article h3{font-size:1.1em}
article a{color:var(--accent);text-decoration:none}
article a.wl.missing{color:var(--muted);text-decoration:underline dotted}
article code{background:var(--code);padding:.1em .35em;border-radius:4px;font-size:.9em}
article pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto}
article pre code{padding:0;background:none}
article table{border-collapse:collapse;display:block;overflow:auto;max-width:100%}
article th,article td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
article th{background:var(--panel)}
article blockquote{margin:0;padding:0 1em;color:var(--muted);border-left:4px solid var(--line)}
article img{max-width:100%;height:auto;border-radius:6px}
article ul.contains-task-list,article li.task-list-item{list-style:none}
article li.task-list-item input{margin-right:.4em}
article .tag{color:var(--accent);background:var(--accent-bg);border-radius:10px;padding:0 .5em;font-size:.9em}
.front{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:1em}
.front div{display:flex;gap:8px}.front b{font-weight:600}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.back{margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
.back h4{margin:0 0 6px;font-size:14px;color:var(--muted)}
.back button{display:block;border:0;background:none;color:var(--accent);padding:6px 0;cursor:pointer;text-align:left}
.empty{color:var(--muted);padding:40px 20px;text-align:center}
.panel{max-width:620px;margin:0 auto;padding:24px 20px 60px}
.panel h2{font-size:20px;margin:.2em 0 .6em}
.panel label{display:block;font-size:14px;font-weight:600;margin:16px 0 4px}
.panel input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.panel p,.panel li{font-size:14px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:13px;color:var(--warn)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{border-right:0}
  .app.reading aside{display:none}
  .app:not(.reading) main{display:none}
  .bar{display:flex;gap:8px;align-items:center}
  article{padding:16px 16px 80px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="top">
      <h1 id="vaultName">ノートビューア</h1>
      <button class="iconbtn" id="syncBtn" title="ドライブから最新を読み込む">更新</button>
      <button class="iconbtn" id="setBtn" title="設定">設定</button>
    </div>
    <input class="search" id="q" type="search" placeholder="ファイル名・本文を検索" autocomplete="off">
    <div class="status" id="status"></div>
    <div class="list" id="list"></div>
  </aside>
  <main id="main">
    <div class="bar"><button class="iconbtn" id="backBtn">← 一覧</button><span id="barTitle" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span></div>
    <div id="view"><div class="empty">左の一覧からノートを選んでください</div></div>
  </main>
</div>
<input type="file" id="dirPick" webkitdirectory multiple hidden>

<script>
"use strict";
// ---------- 保存（端末内：IndexedDB。読めない環境でも動くようにする） ----------
const DB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const r = indexedDB.open("vault-viewer", 1);
        r.onupgradeneeded = () => { r.result.createObjectStore("notes", { keyPath: "path" }); r.result.createObjectStore("kv"); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const db = await open(); if (!db) return null;
    return new Promise((res) => { try { const t = db.transaction(store, mode); const out = fn(t.objectStore(store)); t.oncomplete = () => res(out instanceof IDBRequest ? out.result : out); t.onerror = () => res(null); } catch (e) { res(null); } });
  }
  return {
    all: () => tx("notes", "readonly", (s) => s.getAll()),
    putMany: (arr) => tx("notes", "readwrite", (s) => { arr.forEach((n) => s.put(n)); }),
    clear: () => tx("notes", "readwrite", (s) => s.clear()),
    get: (k) => tx("kv", "readonly", (s) => s.get(k)),
    set: (k, v) => tx("kv", "readwrite", (s) => s.put(v, k)),
  };
})();
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// ---------- 状態 ----------
const S = { notes: [], byName: new Map(), current: null, source: ls.get("source", ""), token: null, tokenExp: 0, folderId: ls.get("folderId", "") };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function setStatus(t) { $("status").textContent = t; }

function indexNotes(notes) {
  // フォルダごとにまとめる（最上位のノートを先に、その後フォルダ順）
  const dir = (p) => (p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "");
  S.notes = notes.filter((n) => n.path.toLowerCase().endsWith(".md"))
    .sort((a, b) => dir(a.path).localeCompare(dir(b.path), "ja") || a.path.localeCompare(b.path, "ja"));
  S.byName = new Map();
  for (const n of S.notes) {
    const base = n.path.split("/").pop().replace(/\.md$/i, "").toLowerCase();
    if (!S.byName.has(base)) S.byName.set(base, n);
    S.byName.set(n.path.replace(/\.md$/i, "").toLowerCase(), n);
  }
  for (const n of S.notes) n.links = [...n.content.matchAll(/!?\[\[([^\]|#]+)/g)].map((m) => m[1].trim().toLowerCase());
  renderList();
}
function findNote(target) { return S.byName.get(target.trim().replace(/\.md$/i, "").toLowerCase()); }

// ---------- 一覧 ----------
function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const list = $("list"); list.innerHTML = "";
  let shown = 0, lastFolder = null;
  for (const n of S.notes) {
    const name = n.path.split("/").pop().replace(/\.md$/i, "");
    let hit = "";
    if (q) {
      if (name.toLowerCase().includes(q)) hit = "";
      else { const i = n.content.toLowerCase().indexOf(q); if (i < 0) continue; hit = n.content.slice(Math.max(0, i - 15), i + 40).replace(/\s+/g, " "); }
    }
    const folder = n.path.includes("/") ? n.path.slice(0, n.path.lastIndexOf("/")) : "";
    if (folder !== lastFolder) { if (folder) { const f = document.createElement("div"); f.className = "folder"; f.textContent = folder; list.appendChild(f); } lastFolder = folder; }
    const b = document.createElement("button");
    b.className = "item" + (S.current === n ? " on" : "");
    b.innerHTML = esc(name) + (hit ? `<small>…${esc(hit)}…</small>` : "");
    b.onclick = () => openNote(n);
    list.appendChild(b); shown++;
  }
  if (!S.notes.length) list.innerHTML = '<div class="empty">まだノートがありません。<br>「設定」から読み込み元を選んでください。</div>';
  else if (!shown) list.innerHTML = '<div class="empty">見つかりませんでした</div>';
}

// ---------- 表示 ----------
marked.setOptions({ gfm: true, breaks: true });
function renderMarkdown(src) {
  let front = "";
  const fm = src.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (fm) {
    const rows = fm[1].split(/\r?\n/).map((l) => l.match(/^([^:#][^:]*):\s*(.*)$/)).filter(Boolean);
    if (rows.length) front = '<div class="front">' + rows.map((r) => `<div><b>${esc(r[1])}</b><span>${esc(r[2])}</span></div>`).join("") + "</div>";
    src = src.slice(fm[0].length);
  }
  src = src.replace(/%%[\s\S]*?%%/g, "");                                    // Obsidianのコメント
  const parts = src.split(/(```[\s\S]*?```|`[^`\n]*`)/);                     // コードの中は変換しない
  for (let i = 0; i < parts.length; i += 2) {
    parts[i] = parts[i]
      .replace(/!\[\[([^\]|]+)(?:\|[^\]]*)?\]\]/g, (m, t) => `<span class="embed" data-t="${esc(t.trim())}">［${esc(t.trim())}］</span>`)
      .replace(/\[\[([^\]|#]+)(#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (m, t, h, alias) =>
        `<a href="#" class="wl${findNote(t) ? "" : " missing"}" data-t="${esc(t.trim())}">${esc((alias || t + (h || "")).trim())}</a>`)
      .replace(/(^|[\s(])#([^\s#.,、。()\[\]{}!?"'`]+)/g, (m, p, tag) => /^\d+$/.test(tag) ? m : `${p}<span class="tag">#${esc(tag)}</span>`);
  }
  const html = marked.parse(parts.join(""));
  return front + DOMPurify.sanitize(html, { ADD_ATTR: ["data-t", "target"] });
}

function openNote(n, push = true) {
  S.current = n;
  const name = n.path.split("/").pop().replace(/\.md$/i, "");
  const key = name.toLowerCase(), keyPath = n.path.replace(/\.md$/i, "").toLowerCase();
  const backs = S.notes.filter((o) => o !== n && o.links.some((l) => l === key || l === keyPath));
  const when = n.modified ? new Date(n.modified).toLocaleString("ja-JP") : "";
  $("view").innerHTML = `<article><div class="meta">${esc(n.path)}${when ? "　更新 " + esc(when) : ""}</div><h1>${esc(name)}</h1>${renderMarkdown(n.content)}` +
    (backs.length ? `<div class="back"><h4>このノートへのリンク（${backs.length}）</h4>${backs.map((o, i) => `<button data-i="${S.notes.indexOf(o)}">${esc(o.path.replace(/\.md$/i, ""))}</button>`).join("")}</div>` : "") + "</article>";
  $("view").querySelectorAll("a.wl").forEach((a) => a.onclick = (e) => { e.preventDefault(); const t = findNote(a.dataset.t); if (t) openNote(t); });
  $("view").querySelectorAll(".back button").forEach((b) => b.onclick = () => openNote(S.notes[+b.dataset.i]));
  $("view").querySelectorAll("a[href^='http']").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
  $("view").querySelectorAll("li input[type=checkbox]").forEach((c) => c.disabled = true);
  loadEmbeds();
  $("barTitle").textContent = name;
  $("app").classList.add("reading");
  $("main").scrollTop = 0;
  if (push) { try { history.pushState({ p: n.path }, "", "#" + encodeURIComponent(n.path)); } catch (e) {} }
  ls.set("last", n.path);
  renderList();
}
window.addEventListener("popstate", (e) => {
  const p = e.state && e.state.p;
  const n = p && S.notes.find((x) => x.path === p);
  if (n) openNote(n, false); else { $("app").classList.remove("reading"); }
});

// 画像（![[画像]]）はドライブから取得したときだけ表示する
async function loadEmbeds() {
  for (const el of $("view").querySelectorAll(".embed")) {
    const t = el.dataset.t;
    if (/\.md$/i.test(t) || !/\.(png|jpe?g|gif|webp|svg)$/i.test(t)) continue;
    const f = (S.files || []).find((x) => x.name === t.split("/").pop());
    if (!f || S.source !== "drive") continue;
    try {
      const r = await gfetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
      const url = URL.createObjectURL(await r.blob());
      el.outerHTML = `<img src="${url}" alt="${esc(t)}">`;
    } catch (e) {}
  }
}

// ---------- 設定画面 ----------
function showSettings() {
  $("app").classList.add("reading");
  $("barTitle").textContent = "設定";
  const cid = ls.get("clientId", ""), folder = ls.get("folderName", "");
  $("view").innerHTML = `<div class="panel">
    <h2>読み込み元</h2>
    <p>このアプリは<b>読み取り専用</b>です。ノートの書き換えや削除はしません。読み込んだノートはこの端末に保存され、電波がなくても読めます。</p>
    <h3>Googleドライブ</h3>
    <label for="cid">OAuth クライアントID</label>
    <input type="text" id="cid" value="${esc(cid)}" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off">
    <label for="fname">保管庫のフォルダ名</label>
    <input type="text" id="fname" value="${esc(folder)}" placeholder="例：バンドルマニュアル">
    <div class="row"><button class="btn primary" id="driveGo">Googleにログインして読み込む</button></div>
    <p class="note" id="driveMsg"></p>
    <h3>ほかの読み込み方</h3>
    <div class="row">
      <button class="btn" id="dirGo">この端末のフォルダを選ぶ</button>
      <button class="btn" id="demoGo">デモデータで試す</button>
    </div>
    <p>「この端末のフォルダを選ぶ」はPCのブラウザ向けです（iPhoneのSafariでは、フォルダごとの選択ができないことがあります）。</p>
    <h3>表示</h3>
    <div class="row">
      <button class="btn" data-theme="">端末の設定に合わせる</button><button class="btn" data-theme="light">ライト</button><button class="btn" data-theme="dark">ダーク</button>
    </div>
    <h3>端末に保存したデータ</h3>
    <div class="row"><button class="btn" id="clearGo">保存したノートを消す</button></div>
  </div>`;
  $("driveGo").onclick = () => { ls.set("clientId", $("cid").value.trim()); ls.set("folderName", $("fname").value.trim()); S.folderId = ""; ls.set("folderId", ""); syncDrive(true); };
  $("dirGo").onclick = () => $("dirPick").click();
  $("demoGo").onclick = loadDemo;
  $("clearGo").onclick = async () => { await DB.clear(); indexNotes([]); setStatus("端末のデータを消しました"); };
  $("view").querySelectorAll("[data-theme]").forEach((b) => b.onclick = () => { applyTheme(b.dataset.theme); ls.set("theme", b.dataset.theme); });
}
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

// ---------- 読み込み：端末のフォルダ ----------
$("dirPick").onchange = async (e) => {
  const files = [...e.target.files].filter((f) => /\.md$/i.test(f.name) && !/(^|\/)\.(obsidian|trash)\//.test(f.webkitRelativePath));
  const notes = [];
  for (const f of files) notes.push({ path: f.webkitRelativePath.split("/").slice(1).join("/"), content: await f.text(), modified: f.lastModified });
  const root = files[0] ? files[0].webkitRelativePath.split("/")[0] : "";
  await useNotes(notes, "folder", root);
  setStatus(`端末のフォルダから ${notes.length} 件を読み込みました`);
};

// ---------- 読み込み：Googleドライブ（読み取り専用の権限） ----------
function loadGis() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.onload = res; s.onerror = () => rej(new Error("Googleのログイン部品を読み込めませんでした"));
    document.head.appendChild(s);
  });
}
async function getToken(interactive) {
  if (S.token && Date.now() < S.tokenExp - 60000) return S.token;
  const cid = ls.get("clientId", "");
  if (!cid) throw new Error("設定でOAuth クライアントIDを入力してください");
  await loadGis();
  return new Promise((res, rej) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: cid, scope: "https://www.googleapis.com/auth/drive.readonly",
      callback: (r) => { if (r.error) return rej(new Error(r.error)); S.token = r.access_token; S.tokenExp = Date.now() + r.expires_in * 1000; res(S.token); },
      error_callback: (e) => rej(new Error(e.message || e.type || "ログインできませんでした")),
    });
    client.requestAccessToken({ prompt: interactive ? "" : "none" });
  });
}
async function gfetch(url) {
  const t = await getToken(false);
  const r = await fetch(url, { headers: { Authorization: "Bearer " + t } });
  if (!r.ok) throw new Error(`ドライブの応答 ${r.status}`);
  return r;
}
async function listFolder(id) {
  const out = []; let page = "";
  do {
    const q = encodeURIComponent(`'${id}' in parents and trashed=false`);
    const r = await (await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,mimeType,modifiedTime)&pageSize=1000${page ? "&pageToken=" + page : ""}`)).json();
    out.push(...r.files); page = r.nextPageToken || "";
  } while (page);
  return out;
}
async function syncDrive(interactive) {
  const msg = (t) => { setStatus(t); const m = $("driveMsg"); if (m) m.textContent = t; };
  try {
    await getToken(interactive);
    if (!S.folderId) {
      const name = ls.get("folderName", "");
      if (!name) throw new Error("設定で保管庫のフォルダ名を入力してください");
      const q = encodeURIComponent(`name='${name.replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
      const r = await (await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`)).json();
      if (!r.files.length) throw new Error(`「${name}」というフォルダがドライブに見つかりません`);
      S.folderId = r.files[0].id; ls.set("folderId", S.folderId);
    }
    msg("ドライブの一覧を取得中…");
    const files = [];
    const walk = async (id, prefix) => {
      for (const f of await listFolder(id)) {
        if (f.mimeType === "application/vnd.google-apps.folder") { if (!/^\.(obsidian|trash)$/.test(f.name)) await walk(f.id, prefix + f.name + "/"); }
        else files.push({ ...f, path: prefix + f.name });
      }
    };
    await walk(S.folderId, "");
    S.files = files;
    const old = new Map(((await DB.all()) || []).map((n) => [n.path, n]));
    const md = files.filter((f) => /\.md$/i.test(f.name));
    const notes = []; let got = 0;
    for (const f of md) {
      const prev = old.get(f.path);
      if (prev && prev.modified === f.modifiedTime && prev.id === f.id) { notes.push(prev); continue; }
      msg(`ノートを取得中… ${++got}`);
      notes.push({ path: f.path, id: f.id, modified: f.modifiedTime, content: await (await gfetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).text() });
    }
    await useNotes(notes, "drive", ls.get("folderName", ""));
    msg(`ドライブから ${notes.length} 件（新しく取得 ${got} 件）　${new Date().toLocaleTimeString("ja-JP")}`);
  } catch (e) {
    msg("読み込めませんでした：" + e.message);
  }
}
async function useNotes(notes, source, name) {
  S.source = source; ls.set("source", source);
  await DB.clear(); await DB.putMany(notes); await DB.set("vaultName", name);
  $("vaultName").textContent = name || "ノートビューア";
  indexNotes(notes);
  const last = notes.find((n) => n.path === ls.get("last", ""));
  if (last) openNote(last, false);
}

$("q").oninput = renderList;

$("backBtn").onclick = () => { $("app").classList.remove("reading"); try { history.pushState({}, "", "#"); } catch (e) {} };
$("syncBtn").onclick = () => { if (S.source === "drive") syncDrive(true); else if (S.source === "folder") $("dirPick").click(); else showSettings(); };
applyTheme(ls.get("theme", ""));
(async () => {
  const notes = (await DB.all()) || [];
  $("vaultName").textContent = (await DB.get("vaultName")) || "ノートビューア";
  if (notes.length) { await useNotes(notes, S.source, $("vaultName").textContent); setStatus(`端末に保存した ${notes.length} 件を表示中`); }
  else renderList();
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
